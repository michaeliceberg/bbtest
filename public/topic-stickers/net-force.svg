<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes slide { 0%,100% { transform: translateX(0); } 100% { transform: translateX(0); } 60% { transform: translateX(18px); } }
@keyframes pulseArrow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
.block { animation: slide 1.6s ease-in-out infinite; }
.arrow { animation: pulseArrow 1.6s ease-in-out infinite; }

</style>

<g class="arrow">
  <line x1="18" y1="95" x2="45" y2="95" stroke="#FF8C42" stroke-width="7" stroke-linecap="round"/>
  <path d="M 39 83 L 61 95 L 39 107 Z" fill="#FF8C42"/>
</g>
<g class="block">
  <rect x="60" y="72" width="55" height="46" rx="8" fill="#96A3AF"/>
  <rect x="60" y="72" width="55" height="12" rx="8" fill="#C9D3DC" opacity=".3"/>
</g>
<g stroke="#6B7680" stroke-width="4" stroke-linecap="round" opacity=".5">
  <line x1="20" y1="140" x2="35" y2="140"/>
  <line x1="42" y1="140" x2="57" y2="140"/>
</g>
<line x1="18" y1="160" x2="145" y2="160" stroke="#6B7680" stroke-width="5" stroke-linecap="round"/>

</svg>