<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes leftBall { 0%,45% { transform: translateX(0); } 55%,100% { transform: translateX(0); } 50% { transform: translateX(38px); } }
@keyframes rightBall { 0%,50% { transform: translateX(0); } 100% { transform: translateX(38px); } }
@keyframes arrowL { 0%,45% { opacity: 1; } 50%,100% { opacity: 0; } }
@keyframes arrowR { 0%,50% { opacity: 0; } 55%,100% { opacity: 1; } }
.ballL { animation: leftBall 2s ease-in-out infinite; }
.ballR { animation: rightBall 2s ease-in-out infinite; }
.arrowL { animation: arrowL 2s ease-in-out infinite; }
.arrowR { animation: arrowR 2s ease-in-out infinite; }

</style>

<line x1="15" y1="150" x2="145" y2="150" stroke="#6B7680" stroke-width="5" stroke-linecap="round"/>
<g class="ballL">
  <circle cx="55" cy="120" r="20" fill="#96A3AF"/>
  <ellipse cx="48" cy="112" rx="6" ry="4" fill="#C9D3DC" opacity=".5"/>
  <g class="arrowL">
    <line x1="20" y1="120" x2="34" y2="120" stroke="#FF8C42" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30 111 L 44 120 L 30 129 Z" fill="#FF8C42"/>
  </g>
</g>
<g class="ballR" transform="translate(40,0)">
  <circle cx="55" cy="120" r="20" fill="#7dd3fc"/>
  <ellipse cx="48" cy="112" rx="6" ry="4" fill="#fff" opacity=".4"/>
  <g class="arrowR">
    <line x1="80" y1="120" x2="94" y2="120" stroke="#FF8C42" stroke-width="6" stroke-linecap="round"/>
    <path d="M 90 111 L 104 120 L 90 129 Z" fill="#FF8C42"/>
  </g>
</g>

</svg>