<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes gather { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0,0) scale(1.05); } }
@keyframes glow { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.15); } }
#core { animation: gather 2s ease-in-out infinite; transform-origin: 80px 100px; }
.glow { animation: glow 2s ease-in-out infinite; transform-origin: 80px 100px; }

</style>

<circle class="glow" cx="80" cy="100" r="40" fill="#FFD400"/>
<g id="core"><circle cx="70" cy="90" r="10" fill="#FF8C42"/><circle cx="92" cy="88" r="10" fill="#FF8C42"/><circle cx="80" cy="108" r="10" fill="#FF8C42"/><circle cx="68" cy="112" r="10" fill="#FF8C42"/><circle cx="94" cy="108" r="10" fill="#FF8C42"/><circle cx="80" cy="78" r="10" fill="#B8C4CC"/><circle cx="58" cy="100" r="10" fill="#B8C4CC"/><circle cx="102" cy="100" r="10" fill="#B8C4CC"/><circle cx="72" cy="122" r="10" fill="#B8C4CC"/><circle cx="90" cy="122" r="10" fill="#B8C4CC"/></g>

</svg>