<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes move { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulseArrow { 0%,100% { opacity:.5; transform: scaleY(.9); } 50% { opacity:1; transform: scaleY(1.1); } }
.car { animation: move 2s ease-in-out infinite; }
.arrow { animation: pulseArrow 2s ease-in-out infinite; transform-origin: 80px 108px; }

</style>

<rect x="35" y="15" width="90" height="170" rx="4" fill="none" stroke="#6B7680" stroke-width="4"/>
<g class="car">
  <rect x="45" y="55" width="70" height="55" rx="6" fill="#96A3AF"/>
  <circle cx="80" cy="78" r="12" fill="#C9D3DC" opacity=".6"/>
  <rect x="68" y="90" width="24" height="18" fill="#C9D3DC" opacity=".5"/>
</g>
<g class="arrow">
  <line x1="80" y1="112" x2="80" y2="140" stroke="#FF8C42" stroke-width="7" stroke-linecap="round"/>
  <path d="M 66 134 L 80 154 L 94 134 Z" fill="#FF8C42"/>
</g>
<path d="M 20 45 L 20 25 M 12 33 L 20 25 L 28 33" stroke="#6B7680" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 140 155 L 140 175 M 132 167 L 140 175 L 148 167" stroke="#6B7680" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

</svg>