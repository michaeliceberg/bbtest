<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes swing { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(28deg); } }
#pend { animation: swing 1.8s ease-in-out infinite; transform-origin: 80px 30px; }

@keyframes fadeL { 0%,10%,90%,100% { opacity: 0; } 50% { opacity: 1; } }
@keyframes fadeR { 0%,40%,60%,100% { opacity: 0; } 90% { opacity: 1; } 10% { opacity: 1; } }

</style>

<circle cx="80" cy="30" r="4" fill="#6B7680"/>
<line x1="30" y1="30" x2="130" y2="30" stroke="#6B7680" stroke-width="4" stroke-linecap="round"/>
<g id="pend">
  <line x1="80" y1="30" x2="80" y2="140" stroke="#F2F7FB" stroke-width="2.5"/>
  <circle cx="80" cy="150" r="18" fill="#96A3AF"/>
  <ellipse cx="74" cy="144" rx="6" ry="4" fill="#C9D3DC" opacity=".5"/>
</g>

<text x="30" y="45" font-size="13" fill="#FFD400" style="animation: fadeL 1.8s ease-in-out infinite">Eпот</text>
<text x="112" y="150" font-size="13" fill="#FF8C42" style="animation: fadeR 1.8s ease-in-out infinite">Eкин</text>


</svg>