<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes glow { 0%,100% { opacity:.35; } 50% { opacity:.75; } }
.ball { animation: bob 1.8s ease-in-out infinite; transform-origin: 100px 70px; }
.glow { animation: glow 1.8s ease-in-out infinite; }

</style>

<path d="M 20 165 L 60 165 L 60 100 L 140 100 L 140 165" fill="none" stroke="#6B7680" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="60" y1="95" x2="60" y2="165" stroke="#F2F7FB" stroke-width="2" stroke-dasharray="4 4"/>
<text x="45" y="135" font-size="16" text-anchor="middle">h</text>
<g class="ball">
  <circle class="glow" cx="100" cy="72" r="20" fill="#FFD400" opacity=".4"/>
  <circle cx="100" cy="72" r="17" fill="#96A3AF"/>
  <ellipse cx="93" cy="65" rx="6" ry="4" fill="#C9D3DC" opacity=".5"/>
</g>

</svg>