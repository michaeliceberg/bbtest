<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes slide { 0%,100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }
@keyframes trail { 0%,100% { opacity:.15; } 50% { opacity:.6; } }
.ball { animation: slide 1.4s ease-in-out infinite; }
.lines { animation: trail 1.4s ease-in-out infinite; }

</style>

<g class="lines" stroke="#FF8C42" stroke-width="4" stroke-linecap="round">
  <line x1="20" y1="90" x2="45" y2="90"/>
  <line x1="20" y1="105" x2="50" y2="105"/>
  <line x1="20" y1="120" x2="45" y2="120"/>
</g>
<g class="ball">
  <circle cx="90" cy="105" r="30" fill="#96A3AF"/>
  <ellipse cx="80" cy="94" rx="9" ry="6" fill="#C9D3DC" opacity=".5"/>
</g>
<line x1="20" y1="165" x2="140" y2="165" stroke="#6B7680" stroke-width="5" stroke-linecap="round"/>

</svg>