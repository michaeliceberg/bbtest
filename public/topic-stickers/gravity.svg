<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
@keyframes pulseArrow { 0%,100% { opacity:.55; transform: scaleY(.9); } 50% { opacity:1; transform: scaleY(1.1); } }
.weight { animation: bob 1.6s ease-in-out infinite; transform-origin: 80px 95px; }
.arrow { animation: pulseArrow 1.6s ease-in-out infinite; transform-origin: 80px 140px; }

</style>

<g class="weight">
  <path d="M 62 45 A 18 18 0 0 1 98 45" fill="none" stroke="#6B7680" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="80" cy="95" rx="42" ry="38" fill="#96A3AF"/>
  <ellipse cx="66" cy="82" rx="13" ry="9" fill="#C9D3DC" opacity=".45"/>
</g>
<g class="arrow">
  <line x1="80" y1="142" x2="80" y2="178" stroke="#FF8C42" stroke-width="7" stroke-linecap="round"/>
  <path d="M 66 172 L 80 196 L 94 172 Z" fill="#FF8C42"/>
</g>

</svg>