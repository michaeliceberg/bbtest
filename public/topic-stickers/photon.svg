<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes move { 0%,100% { transform: translateX(-20px); } 50% { transform: translateX(20px); } }
@keyframes pulse { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
#p { animation: move 1.6s ease-in-out infinite; }
.core { animation: pulse 0.8s ease-in-out infinite; transform-origin: center; }

</style>

<g id="p">
  <path class="core" d="M 80 80 L 88 96 L 106 100 L 88 104 L 80 120 L 72 104 L 54 100 L 72 96 Z" fill="#FFE066"/>
  <line x1="108" y1="100" x2="128" y2="100" stroke="#FF8C42" stroke-width="5" stroke-linecap="round"/>
  <path d="M 122 92 L 134 100 L 122 108 Z" fill="#FF8C42"/>
</g>

</svg>