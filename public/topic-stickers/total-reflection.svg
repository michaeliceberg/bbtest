<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes travel { 0% { stroke-dashoffset: 50; } 100% { stroke-dashoffset: 0; } }
.ray { stroke-dasharray: 6 4; animation: travel 1s linear infinite; }

</style>

<rect x="10" y="100" width="140" height="65" fill="#5AA9E6" opacity=".3"/>
<line x1="10" y1="100" x2="150" y2="100" stroke="#2E6DA4" stroke-width="2.5"/>
<line class="ray" x1="50" y1="160" x2="80" y2="100" stroke="#FFE066" stroke-width="4" stroke-linecap="round"/>
<line class="ray" x1="80" y1="100" x2="110" y2="160" stroke="#FFE066" stroke-width="4" stroke-linecap="round" style="animation-delay:.3s"/>

</svg>