<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes shrink { 0%,45% { transform: scale(1); } 55%,100% { transform: scale(.72); } }
@keyframes eject { 0%,45% { transform: translate(0,0); opacity: 0; } 55% { opacity: 1; } 100% { transform: translate(50px,-38px); opacity: 0; } }
#core { animation: shrink 2.6s ease-in-out infinite; transform-origin: 75px 105px; }
#particle { animation: eject 2.6s ease-out infinite; }

</style>

<g id="core"><circle cx="66" cy="96" r="11" fill="#FF8C42"/><circle cx="86" cy="94" r="11" fill="#FF8C42"/><circle cx="76" cy="114" r="11" fill="#FF8C42"/><circle cx="76" cy="96" r="11" fill="#B8C4CC"/><circle cx="56" cy="108" r="11" fill="#B8C4CC"/><circle cx="96" cy="108" r="11" fill="#B8C4CC"/></g>
<g id="particle">
  <circle cx="76" cy="96" r="9" fill="#FF8C42"/>
  <circle cx="73" cy="93" r="3" fill="#fff" opacity=".5"/>
</g>

</svg>