<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.f { animation: pulse 1.6s ease-in-out infinite; }

</style>

<circle cx="45" cy="100" r="24" fill="#FF8C42"/>
<text x="45" y="107" font-size="22" text-anchor="middle" fill="#1B242A" font-weight="700">+</text>
<circle cx="115" cy="100" r="24" fill="#5AA9E6"/>
<text x="115" y="107" font-size="26" text-anchor="middle" fill="#0E1417" font-weight="700">−</text>
<g class="f" stroke="#FF8C42" stroke-width="5" stroke-linecap="round">
  <line x1="72" y1="100" x2="86" y2="100"/>
  <path d="M 80 92 L 92 100 L 80 108 Z" fill="#FF8C42" stroke="none"/>

</g>

</svg>