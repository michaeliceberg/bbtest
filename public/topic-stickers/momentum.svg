<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes slide { 0%,100% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
@keyframes pulseArrow { 0%,100% { opacity:.55; transform: scaleX(.9); } 50% { opacity:1; transform: scaleX(1.15); } }
.ball { animation: slide 1.5s ease-in-out infinite; }
.arrow { animation: pulseArrow 1.5s ease-in-out infinite; transform-origin: 120px 100px; }

</style>

<g class="ball">
  <circle cx="70" cy="100" r="26" fill="#96A3AF"/>
  <ellipse cx="61" cy="90" rx="8" ry="5" fill="#C9D3DC" opacity=".5"/>
</g>
<g class="arrow">
  <line x1="100" y1="100" x2="132" y2="100" stroke="#FF8C42" stroke-width="7" stroke-linecap="round"/>
  <path d="M 126 88 L 148 100 L 126 112 Z" fill="#FF8C42"/>
</g>
<line x1="20" y1="150" x2="140" y2="150" stroke="#6B7680" stroke-width="5" stroke-linecap="round"/>

</svg>