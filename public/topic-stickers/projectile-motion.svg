<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes fly { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
#proj { offset-path: path('M 20 150 Q 80 20 140 150'); animation: fly 2s ease-in-out infinite alternate; }

</style>

<path d="M 20 150 Q 80 20 140 150" fill="none" stroke="#6B7680" stroke-width="2.5" stroke-dasharray="4 5"/>
<line x1="20" y1="150" x2="140" y2="150" stroke="#6B7680" stroke-width="4" stroke-linecap="round"/>
<line x1="80" y1="150" x2="80" y2="25" stroke="#F2F7FB" stroke-width="2" stroke-dasharray="3 4"/>
<text x="90" y="90" font-size="14">H</text>
<text x="75" y="170" font-size="14" text-anchor="middle">L</text>
<circle id="proj" cx="0" cy="0" r="12" fill="#96A3AF"/>

</svg>