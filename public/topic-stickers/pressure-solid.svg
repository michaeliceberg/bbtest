<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes press { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@keyframes arrows { 0%,100% { opacity:.5; } 50% { opacity:1; } }
.block { animation: press 1.5s ease-in-out infinite; transform-origin: 80px 90px; }
.forces { animation: arrows 1.5s ease-in-out infinite; }

</style>

<g class="forces"><line x1="52" y1="35" x2="52" y2="58" stroke="#FF8C42" stroke-width="5" stroke-linecap="round"/><path d="M 46 52 L 52 64 L 58 52 Z" fill="#FF8C42"/><line x1="80" y1="35" x2="80" y2="58" stroke="#FF8C42" stroke-width="5" stroke-linecap="round"/><path d="M 74 52 L 80 64 L 86 52 Z" fill="#FF8C42"/><line x1="108" y1="35" x2="108" y2="58" stroke="#FF8C42" stroke-width="5" stroke-linecap="round"/><path d="M 102 52 L 108 64 L 114 52 Z" fill="#FF8C42"/></g>
<g class="block">
  <rect x="35" y="65" width="90" height="55" rx="6" fill="#96A3AF"/>
  <rect x="35" y="65" width="90" height="14" rx="6" fill="#C9D3DC" opacity=".3"/>
</g>
<rect x="20" y="120" width="120" height="10" rx="3" fill="#6B7680"/>
<g stroke="#6B7680" stroke-width="3">
  <line x1="28" y1="130" x2="18" y2="140"/><line x1="48" y1="130" x2="38" y2="140"/>
  <line x1="68" y1="130" x2="58" y2="140"/><line x1="88" y1="130" x2="78" y2="140"/>
  <line x1="108" y1="130" x2="98" y2="140"/><line x1="128" y1="130" x2="118" y2="140"/>
</g>

</svg>