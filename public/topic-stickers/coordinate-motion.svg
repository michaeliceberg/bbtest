<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes roll { 0%,100% { transform: translateX(-30px); } 50% { transform: translateX(30px); } }
.ball { animation: roll 2.2s ease-in-out infinite; }

</style>

<line x1="15" y1="140" x2="145" y2="140" stroke="#6B7680" stroke-width="4" stroke-linecap="round"/>
<g stroke="#6B7680" stroke-width="2">
  <line x1="35" y1="135" x2="35" y2="145"/><line x1="65" y1="135" x2="65" y2="145"/>
  <line x1="95" y1="135" x2="95" y2="145"/><line x1="125" y1="135" x2="125" y2="145"/>
</g>
<line x1="35" y1="140" x2="95" y2="140" stroke="#FF8C42" stroke-width="4"/>
<g class="ball">
  <circle cx="80" cy="115" r="20" fill="#96A3AF"/>
  <ellipse cx="73" cy="107" rx="6" ry="4" fill="#C9D3DC" opacity=".5"/>
</g>
<text x="35" y="165" font-size="16" text-anchor="middle">0</text>
<text x="95" y="165" font-size="16" text-anchor="middle">x</text>

</svg>