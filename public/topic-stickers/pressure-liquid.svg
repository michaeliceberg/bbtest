<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes ripple { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(1.04); } }
@keyframes pulse { 0%,100% { opacity:.5; transform: scale(.85); } 50% { opacity:1; transform: scale(1.05); } }
.surface { animation: ripple 2.4s ease-in-out infinite; transform-origin: 80px 40px; }
.mark { animation: pulse 1.6s ease-in-out infinite; transform-origin: 80px 130px; }

</style>

<rect x="30" y="40" width="100" height="115" rx="6" fill="none" stroke="#6B7680" stroke-width="4"/>
<defs>
  <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5AA9E6" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#2E6DA4" stop-opacity=".85"/>
  </linearGradient>
</defs>
<rect x="32" y="42" width="96" height="111" fill="url(#liq)"/>
<path class="surface" d="M 32 43 Q 55 37 80 43 T 128 43" fill="none" stroke="#2E6DA4" stroke-width="3" stroke-linecap="round"/>
<line x1="20" y1="43" x2="20" y2="130" stroke="#F2F7FB" stroke-width="2"/>
<text x="12" y="90" font-size="16" text-anchor="middle">h</text>
<g class="mark">
  <circle cx="80" cy="130" r="6" fill="#FF8C42"/>
  <line x1="86" y1="130" x2="102" y2="130" stroke="#FF8C42" stroke-width="4" stroke-linecap="round"/>
  <line x1="74" y1="130" x2="58" y2="130" stroke="#FF8C42" stroke-width="4" stroke-linecap="round"/>
</g>

</svg>