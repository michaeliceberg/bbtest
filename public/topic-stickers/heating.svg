<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes rise { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.35); } }
@keyframes flame { 0%,100% { transform: scaleY(1) rotate(0deg); } 50% { transform: scaleY(1.15) rotate(-3deg); } }
#mercury { animation: rise 1.8s ease-in-out infinite; transform-origin: bottom; }
.flame { animation: flame 0.9s ease-in-out infinite; transform-origin: bottom; }

</style>

<rect x="70" y="20" width="20" height="90" rx="10" fill="none" stroke="#6B7680" stroke-width="4"/>
<circle cx="80" cy="125" r="20" fill="none" stroke="#6B7680" stroke-width="4"/>
<rect id="mercury" x="75" y="60" width="10" height="55" fill="#FF8C42"/>
<circle cx="80" cy="125" r="14" fill="#FF8C42"/>
<path class="flame" d="M 40 180 Q 33 162 42 150 Q 50 162 45 174 Q 55 162 49 148 Q 63 162 51 184 Z" fill="#FF6B4A"/>
<path class="flame" d="M 120 180 Q 113 165 121 154 Q 128 165 124 176 Z" fill="#FF6B4A" opacity=".85"/>

</svg>