<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
<style>
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F2F7FB; }

@keyframes travel { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
.ray { stroke-dasharray: 6 4; animation: travel 1s linear infinite; }

</style>

<path d="M 80 25 Q 105 100 80 175 Q 55 100 80 25 Z" fill="#5AA9E6" opacity=".25" stroke="#2E6DA4" stroke-width="2.5"/>
<line class="ray" x1="15" y1="60" x2="80" y2="70" stroke="#FFE066" stroke-width="3.5" stroke-linecap="round"/>
<line class="ray" x1="80" y1="70" x2="150" y2="100" stroke="#FFE066" stroke-width="3.5" stroke-linecap="round" style="animation-delay:.15s"/>
<line class="ray" x1="15" y1="140" x2="80" y2="130" stroke="#FFE066" stroke-width="3.5" stroke-linecap="round" style="animation-delay:.3s"/>
<line class="ray" x1="80" y1="130" x2="150" y2="100" stroke="#FFE066" stroke-width="3.5" stroke-linecap="round" style="animation-delay:.45s"/>
<circle cx="150" cy="100" r="3" fill="#FF8C42"/>

</svg>