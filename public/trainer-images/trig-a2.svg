<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<style>
@keyframes drawUnknownLine {
  0% { stroke-dashoffset: var(--len); opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 1; }
}
@keyframes bounceInQ {
  0% { opacity: 0; transform: scale(0.2); }
  55% { opacity: 1; transform: scale(1.35); }
  75% { transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1); }
}
.unknown-line {
  stroke-dasharray: var(--len);
  stroke-dashoffset: var(--len);
  animation: drawUnknownLine 0.9s ease-out 1.5s forwards;
  opacity: 0;
}
.q-mark {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: bounceInQ 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 2.25s forwards;
}
</style>
<line x1="120.0" y1="120.0" x2="84.6" y2="58.8" stroke="#7dd3fc" stroke-width="4.5" stroke-linecap="round"/>
