<svg xmlns="http://www.w3.org/2000/svg" viewBox="-136.4 -20.0 202.1 130.9">
<style>
@keyframes drawUnknownLine {
  0% { stroke-dashoffset: var(--len); }
  100% { stroke-dashoffset: 0; }
}
@keyframes bounceInQ {
  0% { opacity: 0; transform: scale(0.2); }
  55% { opacity: 1; transform: scale(1.35); }
  75% { transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1); }
}
.unknown-line {
  stroke-dasharray: var(--len);
  stroke-dashoffset: var(--len);
  animation: drawUnknownLine 0.9s ease-out 1.5s forwards;
}
.q-mark {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: bounceInQ 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 2.25s forwards;
}
text { font-family: Nunito, -apple-system, 'Segoe UI', Roboto, sans-serif; }
</style>
