<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Прямоугольный треугольник: прямой угол при C (280,220), угол α при A (40,220) -->
  <polygon points="40,220 280,220 280,60" fill="none" stroke="#F2F7FB" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Метка прямого угла при C -->
  <rect x="262" y="202" width="18" height="18" fill="none" stroke="#F2F7FB" stroke-width="3"/>

  <!-- Дуга угла α при A — sweep-flag=0 (было 1): бывшая дуга выгибалась
       наружу треугольника (влево от вершины A), по просьбе пользователя
       развёрнута в противоположную сторону — теперь выгибается внутрь
       угла, между сторонами a и c. -->
  <path d="M 70 220 A 30 30 0 0 0 65.4 203.2" fill="none" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round"/>
  <text x="76" y="207" font-size="20" fill="#6EE7B7" font-family="Georgia, serif" font-style="italic">α</text>

  <!-- Катет a — прилежащий к α (нижняя сторона) -->
  <text x="160" y="248" font-size="24" fill="#F2F7FB" font-family="Georgia, serif" font-style="italic" text-anchor="middle">a</text>

  <!-- Катет b — противолежащий α (правая сторона) -->
  <text x="304" y="146" font-size="24" fill="#F2F7FB" font-family="Georgia, serif" font-style="italic" text-anchor="middle">b</text>

  <!-- Гипотенуза c (наклонная сторона) -->
  <text x="141" y="122" font-size="24" fill="#F2F7FB" font-family="Georgia, serif" font-style="italic" text-anchor="middle" transform="rotate(-34 141 122)">c</text>

  <!-- Вершины -->
  <circle cx="40" cy="220" r="3.5" fill="#F2F7FB"/>
  <circle cx="280" cy="220" r="3.5" fill="#F2F7FB"/>
  <circle cx="280" cy="60" r="3.5" fill="#F2F7FB"/>
</svg>
